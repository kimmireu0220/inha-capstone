<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원본 스튜디오</title><meta name="description" content="이미지 편집 스튜디오"><link rel="stylesheet" href="/style.css?v=6"></head><body>
<header><a class="brand" href="/">◒ 원본 스튜디오</a></header>
<main><aside><div class="section-head"><h2>내 작업</h2><label class="upload small">＋ 이미지<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label></div><div id="projects"></div><button id="sample" class="secondary">샘플 사용</button><hr><h2>이전 버전</h2><div id="versions"></div></aside>
<section class="workspace"><div class="section-head"><div><h1 id="title">이미지 편집</h1></div><a id="download" class="secondary" hidden download="studio.png">다운로드</a></div><div id="empty"><span class="empty-mark">◒</span><h2>이미지를 추가하세요</h2><label class="upload" for="file">이미지 업로드</label></div><div id="canvas" hidden><div class="pictures"><figure><figcaption>원본</figcaption><img id="original" alt="원본"></figure><figure><figcaption id="result-label">결과</figcaption><img id="result" alt="현재 편집 결과"></figure></div></div><details id="comparison" hidden><summary>결과 비교</summary><div class="pictures"><figure><select id="compare-left" aria-label="왼쪽 비교 버전"></select><img id="compare-left-image" alt="왼쪽 비교 결과"></figure><figure><select id="compare-right" aria-label="오른쪽 비교 버전"></select><img id="compare-right-image" alt="오른쪽 비교 결과"></figure></div></details><div id="status" role="status" aria-live="polite"></div></section>
<aside class="editor"><h2>무엇을 바꿀까요?</h2><form id="chat"><textarea id="request" maxlength="1000" rows="3" placeholder="예: 셔츠는 남색, 배경은 바다로" aria-label="수정 요청"></textarea><button class="secondary" type="submit">요청 적용</button></form><div id="messages"></div><details id="options"><summary>세부 설정</summary><form id="settings"><label>셔츠 색<input name="shirt_color" placeholder="원본 유지" maxlength="120"></label><label>배경<input name="background" placeholder="원본 유지" maxlength="120"></label><label>원형 핀<input name="pin" placeholder="없음 또는 색상" maxlength="120"></label><button class="secondary" type="submit">설정 저장</button></form></details><div class="generation-controls"><label>생성 방식<select id="generation-mode"><option value="regenerate">일괄 재생성</option><option value="sequential">순차 생성</option></select></label><p id="mode-hint" class="hint"></p><details><summary>시드 설정</summary><form id="seed-settings"><label>시드<input id="generation-seed" type="number" min="0" max="2147483647" step="1" placeholder="자동"></label><button type="submit" class="secondary">시드 저장</button></form></details></div><button id="generate" class="primary">이미지 만들기</button></aside></main><script src="/app.js?v=6"></script></body></html>
